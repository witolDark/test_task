<ng-container *ngIf="isLoading$ | async; else content">
  <div class="full">
    <mat-spinner></mat-spinner>
  </div>
</ng-container>
<ng-template #content>
  <ng-container *ngIf="selectedArticle$ | async as article; else noContent">
    <div class="container">
      <div class="cover">
        <img [src]="article.image_url" alt="cover image"/>
      </div>
      <div class="absolute">
        <div class="details">
          <h1 class="details-title">
            {{ article.title }}
          </h1>
          <article class="details-description">
            {{ article.summary }}
          </article>
        </div>
        <a class="nav-btn" routerLink="/">
          <mat-icon svgIcon="arrow" style="transform: scaleX(-1)"></mat-icon>
          <span>Back to homepage</span>
        </a>
      </div>
    </div>
  </ng-container>
</ng-template>
<ng-template #noContent>
  <div>
    No content
  </div>
</ng-template>
